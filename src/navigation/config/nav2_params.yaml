amcl:
  ros__parameters:
    use_sim_time: False # 是否使用仿真时间
    alpha1: 0.5 # 机器人旋转分量对旋转里程计噪声的影响
    alpha2: 0.5 # 机器人平移分量对旋转里程计噪声的影响
    alpha3: 0.2 # 机器人平移分量对平移里程计噪声的影响
    alpha4: 0.2 # 机器人旋转分量对平移里程计噪声的影响
    alpha5: 0.2 # 仅全向模型：平移分量对 strafe 噪声的影响
    base_frame_id: "base_footprint" # 机器人的基座坐标系
    beam_skip_distance: 0.5 # 忽略大部分光束的距离
    beam_skip_error_threshold: 0.9 # 地图匹配错误比例阈值，超过则不忽略光束
    beam_skip_threshold: 0.3 # 忽略光束的比例阈值
    do_beamskip: false # 是否在似然场模型中进行光束跳过
    global_frame_id: "map" # 坐标系系统的名称
    lambda_short: 0.1 # 模型中短读数的指数衰减参数
    laser_likelihood_max_dist: 2.0 # 地图上障碍物膨胀的最大距离
    laser_max_range: 10.0 # 激光雷达最大测量范围
    laser_min_range: 0.2 # 激光雷达最小测量范围
    laser_model_type: "likelihood_field" # 激光雷达模型类型
    max_beams: 60 # 更新滤波器时使用的最大光束数
    max_particles: 2000 # 滤波器允许的最大粒子数
    min_particles: 500 # 滤波器允许的最小粒子数
    odom_frame_id: "odom" # 里程计坐标系
    pf_err: 0.05 # 粒子滤波器的误差
    pf_z: 0.99 # 粒子滤波器的 Z 值
    recovery_alpha_fast: 0.0 # 快速恢复的指数衰减率
    recovery_alpha_slow: 0.0 # 慢速恢复的指数衰减率
    resample_interval: 1 # 重采样间隔
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # 机器人运动模型类型
    save_pose_rate: 0.5 # 存储上次估计姿态的频率 (Hz)
    sigma_hit: 0.2 # 用于 z_hit 部分的高斯模型的标准差
    tf_broadcast: true # 是否发布 TF 变换
    transform_tolerance: 1.0 # TF 变换的容忍时间
    
    update_min_a: 0.05 # 执行更新所需的最小旋转量 (rad)
    update_min_d: 0.1 # 执行更新所需的最小平移量 (m)
    z_hit: 0.5 # 模型中 z_hit 部分的权重
    z_max: 0.05 # 模型中 z_max 部分的权重
    z_rand: 0.5 # 模型中 z_rand 部分的权重
    z_short: 0.05 # 模型中 z_short 部分的权重
    scan_topic: scan # 激光雷达话题
    set_initial_pose: True # 是否设置初始姿态
    initial_pose: 
      x: 0.0 # 初始 X 坐标
      y: 0.0 # 初始 Y 坐标
      yaw: 0.0 # 初始偏航角

amcl_map_client: ## 地图客户端插件## 
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

