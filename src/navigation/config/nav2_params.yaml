local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0 # 代价地图更新频率 (Hz)
      publish_frequency: 2.0 # 代价地图发布频率 (Hz)
      global_frame: odom # 全局坐标系
      robot_base_frame: base_footprint # 机器人基座坐标系
      use_sim_time: False # 是否使用仿真时间
      rolling_window: true # 是否使用滚动窗口
      width: 3 # 滚动窗口宽度 (m)
      height: 3 # 滚动窗口高度 (m)
      resolution: 0.05 # 分辨率 (m/cell)
      robot_radius: 0.01 # 机器人半径 (m)，用于 footprint
      plugins: ["voxel_layer", "inflation_layer"] # 插件列表
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # 膨胀层插件
        cost_scaling_factor: 5.0 # 代价缩放因子
        inflation_radius: 0.15 # 膨胀半径 (m)
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer" # 体素层插件
        enabled: True # 是否启用
        publish_voxel_map: True # 是否发布体素地图
        origin_z: 0.0 # Z 轴原点
        z_resolution: 0.05 # Z 轴分辨率
        z_voxels: 16 # Z 轴体素数量
        max_obstacle_height: 2.0 # 最大障碍物高度
        mark_threshold: 0 # 标记阈值
        observation_sources: scan # 观测源
        scan:
          topic: /scan # 扫描话题
          max_obstacle_height: 2.0 # 最大障碍物高度
          clearing: True # 是否清除障碍物
          marking: True # 是否标记障碍物
          data_type: "LaserScan" # 数据类型
          raytrace_max_range: 3.0 # 光线追踪最大范围
          raytrace_min_range: 0.0 # 光线追踪最小范围
          obstacle_max_range: 2.5 # 障碍物最大范围
          obstacle_min_range: 0.0 # 障碍物最小范围
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer" # 静态层插件
        map_subscribe_transient_local: True # 订阅地图的方式
      always_send_full_costmap: True # 是否总是发送完整的代价地图
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

  local_costmap_client:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0 # 更新频率
      publish_frequency: 1.0 # 发布频率
      global_frame: map # 全局坐标系
      robot_base_frame: base_footprint # 机器人基座坐标系
      use_sim_time: False # 是否使用仿真时间
      robot_radius: 0.01 # 机器人半径
      resolution: 0.05 # 分辨率
      track_unknown_space: true # 是否跟踪未知空间
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] # 插件列表
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # 障碍物层插件
        enabled: True # 是否启用
        observation_sources: scan # 观测源
        scan:
          topic: /scan # 扫描话题
          max_obstacle_height: 2.0 # 最大障碍物高度
          clearing: True # 是否清除
          marking: True # 是否标记
          data_type: "LaserScan" # 数据类型
          raytrace_max_range: 3.0 # 光线追踪最大范围
          raytrace_min_range: 0.0 # 光线追踪最小范围
          obstacle_max_range: 2.5 # 障碍物最大范围
          obstacle_min_range: 0.0 # 障碍物最小范围
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer" # 静态层插件
        map_subscribe_transient_local: True # 订阅地图的方式
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # 膨胀层插件
        cost_scaling_factor: 5.0 # 代价缩放因子
        inflation_radius: 0.15 # 膨胀半径
      always_send_full_costmap: True # 是否总是发送完整的代价地图
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False 
 

map_server: ## 地图服务器插件## 
  ros__parameters:
    use_sim_time: False # 是否使用仿真时间
    #topic_name: map
    #frame_id: map
    yaml_filename: "" # 地图 YAML 文件的路径

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0 # 保存地图的超时时间 (s)
    free_thresh_default: 0.25 # 空闲阈值
    occupied_thresh_default: 0.65 # 占用阈值
    map_subscribe_transient_local: True # 订阅地图的方式

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0 # 期望的规划器频率 (Hz)
    use_sim_time: False
    planner_plugins: ["GridBased"] # 规划器插件列表
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner" # 规划器插件类
      tolerance: 0.5 # 目标容差 (m)
      use_astar: false # 是否使用 A* 算法 (false 则使用 Dijkstra)
      allow_unknown: true # 是否允许在未知空间规划路径

planner_server_rclcpp_node: ## 规划服务器插件## 
  ros__parameters:
    use_sim_time: False

smoother_server: ## 平滑器服务器插件## 
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"] # 平滑器插件列表
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" # 平滑器插件类
      tolerance: 1.0e-10 # 平滑容差
      max_its: 1000 # 最大迭代次数
      do_refinement: True # 是否进行细化

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw # 代价地图话题
    footprint_topic: local_costmap/published_footprint # 足迹话题
    cycle_frequency: 10.0 # 行为服务器循环频率 (Hz)
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"] # 行为插件列表
    spin:
      plugin: "nav2_behaviors/Spin" # 原地旋转行为插件
      # spin_angular_velocity: 0.3
    backup:
      plugin: "nav2_behaviors/BackUp" # 后退行为插件
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading" # 指定朝向移动行为插件
    wait:
      plugin: "nav2_behaviors/Wait" # 等待行为插件
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop" # 辅助遥控行为插件
    global_frame: odom # 全局坐标系
    robot_base_frame: base_footprint # 机器人基座坐标系
    transform_tolerance: 0.1 # TF 变换容差
    use_sim_time: false
    simulate_ahead_time: 2.0 # 模拟向前的时间 (s)
    max_rotational_vel: 0.1 # 最大旋转速度 (rad/s)
    min_rotational_vel: 0.1 # 最小旋转速度 (rad/s)
    rotational_acc_lim: 0.5 # 旋转加速度限制 (rad/s^2)

waypoint_follower: ## 路径点跟随器插件#
  ros__parameters:
    loop_rate: 20 # 循环速率 (Hz)
    stop_on_failure: false # 失败时是否停止
    waypoint_task_executor_plugin: "wait_at_waypoint" # 路径点任务执行器插件
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint" # 等待插件类
      enabled: True # 是否启用
      waypoint_pause_duration: 200 # 路径点暂停时间 (ms)

velocity_smoother: ## 速度平滑器插件
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0 # 平滑频率 (Hz)
    scale_velocities: False # 是否缩放速度
    feedback: "OPEN_LOOP" # 反馈模式
    max_velocity: [0.05, 0.0, 0.2] # 最大速度 [x, y, theta]
    min_velocity: [0.0, 0.0, -0.2] # 最小速度 [x, y, theta]
    max_accel: [0.05, 0.0, 0.3] # 最大加速度 [x, y, theta]
    max_decel: [-0.05, 0.0, -0.3] # 最大减速度 [x, y, theta]
    odom_topic: odom # 里程计话题
    odom_duration: 0.1 # 里程计持续时间
    deadband_velocity: [0.0, 0.0, 0.0] # 速度死区
    velocity_timeout: 1.0 # 速度超时时间

